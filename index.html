<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Isocity, build your own city</title>
  <meta name="description" content="An interactive isometric city builder. Lay roads, place homes, shops and offices, and watch traffic and the day cycle run." />
  <meta property="og:title" content="Isocity, build your own city" />
  <meta property="og:description" content="Lay roads, place buildings and watch the city grow through day and night." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="city.css?v=7" />
</head>
<body>
  <main class="app" id="app">
    <canvas id="stage" aria-label="Isometric city map. Click or drag to build."></canvas>

    <div class="brand" aria-label="Isocity">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 3 13 7v12l-13 7L3 22V10Zm0 14L3 10m13 7 13-7M16 17v12"/></svg>
      <span>Isocity</span>
    </div>
    <header class="stats" aria-label="City statistics">
      <div class="stat"><span class="stat-label">Funds</span><span class="stat-value" id="sMoney">0</span></div>
      <div class="stat"><span class="stat-label">Residents</span><span class="stat-value" id="sPop">0</span></div>
      <div class="stat"><span class="stat-label">Jobs</span><span class="stat-value" id="sJobs">0</span></div>
      <div class="stat"><span class="stat-label">Happiness</span><span class="stat-value" id="sHappy">0</span></div>
      <div class="stat"><span class="stat-label">Net per tick</span><span class="stat-value" id="sNet">0</span></div>
    </header>

    <nav class="tools" aria-label="Build tools" id="tools"></nav>

    <section class="planner" id="planner" aria-label="Tool options">
      <div class="road-modes" id="roadModes" role="group" aria-label="Road shape">
        <button class="chip" id="road-freehand" type="button" aria-pressed="true">Freehand</button>
        <button class="chip" id="road-line" type="button" aria-pressed="false">Line</button>
        <button class="chip" id="road-block" type="button" aria-pressed="false">Block</button>
      </div>
      <p id="planStatus" role="status"></p>
    </section>
    <button class="chip photo-launch" id="photoBtn" type="button" title="Photo mode (P)">Photo mode</button>
    <section class="photo-bar" id="photoBar" aria-label="Photo controls" hidden>
      <p id="photoStatus" role="status">Drag to frame your city. Scroll to zoom.</p>
      <div><button class="chip" id="photoFit" type="button">Fit city</button>
      <button class="chip" id="exportPhoto" type="button">Save PNG</button>
      <button class="chip" id="exitPhoto" type="button">Exit photo</button></div>
    </section>
    <section class="time" aria-label="Time of day">
      <label for="clock" class="stat-label">Time <span id="clockText" class="tnum">12:00</span></label>
      <input id="clock" type="range" min="0" max="24" step="0.05" value="12" />
      <button id="pauseBtn" class="chip" type="button" aria-pressed="false" title="Pause simulation (Space)">Pause</button>
      <button id="autoBtn" class="chip" type="button" aria-pressed="false">Auto cycle</button>
    </section>

    <section class="actions" aria-label="City actions">
      <button id="zoomIn" class="chip icon" type="button" aria-label="Zoom in">+</button>
      <button id="zoomOut" class="chip icon" type="button" aria-label="Zoom out">&minus;</button>
      <button id="fitBtn" class="chip" type="button" aria-label="Fit city in view">Fit</button>
      <button id="undoBtn" class="chip" disabled type="button" aria-label="Undo last change">Undo</button>
      <button id="redoBtn" class="chip" type="button" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="resetBtn" class="chip" type="button">New city</button>
    </section>

    <div id="tip" class="tip" role="status" hidden></div>
    <p class="hint" id="hint">Click or drag to build. Right drag, or the Pan tool, moves the map. Scroll to zoom. F fits the city. Arrow keys pan. Ctrl+Z undoes a stroke.</p>
  </main>
  <script src="city.js?v=7"></script>
</body>
</html>
